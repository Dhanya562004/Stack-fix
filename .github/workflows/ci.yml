name: StackFix AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build, Lint & Automated Testing
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Root & Backend Dependencies
        run: |
          npm ci
          npm --prefix backend ci

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci

      - name: Run Backend Integration & Unit Tests (Jest + Supertest)
        env:
          NODE_ENV: test
          PORT: 5000
          LOG_LEVEL: error
          GEMINI_API_KEY: demo_key_placeholder
        run: |
          npm test -- --coverage

      - name: Build Frontend Application (Vite)
        run: |
          npm run build

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/
